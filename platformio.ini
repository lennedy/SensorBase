; PlatformIO Project Configuration File
;
; Biblioteca DispositivoBase: lib/DispositivoBase
; Exemplo (classe filha): include/FechaduraNFC.h, src/FechaduraNFC.cpp, src/main.cpp

[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200

lib_deps =
    bertmelis/espMqttClient@^1.7.0
    bblanchon/ArduinoJson@^7.0.0

build_flags =
    ; memória livre mínima exigida pelo espMqttClient para aceitar publicações
    ; (padrão 16384 é alto para o ESP8266)
    -D EMC_MIN_FREE_MEMORY=8192
